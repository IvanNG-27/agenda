# Publica la web de Nocta en GitHub Pages cada vez que se sube algo a main.
# Las acciones van fijadas por SHA (la versión en el comentario): una etiqueta se puede mover, un SHA no.
# Node 24 (con npm 11) es el mismo con el que se generan los package-lock.json: con otro npm, `npm ci` puede fallar.
# El sistema va fijo (ubuntu-24.04) para que no cambie solo cuando GitHub mueva ubuntu-latest.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sin permisos por defecto: cada job pide solo los que necesita
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Falla si aparece una vulnerabilidad conocida moderada o peor. Las bajas no bloquean: a veces no tienen arreglo
      # (p. ej. deepmerge dentro de workbox-build, que solo procesa la configuración del propio proyecto al compilar).
      - run: npm audit --audit-level=moderate
      - run: npm audit --audit-level=low
        working-directory: scripts/reminders

  build:
    needs: security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # La web no necesita Electron: evita descargar ~130 MB en cada publicación
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # Solo este job puede publicar en Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

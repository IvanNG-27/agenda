# Publica la web de Nocta en GitHub Pages cada vez que se sube algo a main.
# Las acciones van fijadas por SHA (la versión en el comentario): una etiqueta se puede mover, un SHA no.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sin permisos por defecto: cada job pide solo los que necesita
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Falla si aparece una vulnerabilidad conocida moderada o peor. Las bajas no bloquean: a veces no tienen arreglo
      # (p. ej. deepmerge dentro de workbox-build, que solo procesa la configuración del propio proyecto al compilar).
      - run: npm audit --audit-level=moderate
      - run: npm audit --audit-level=low
        working-directory: scripts/reminders

  build:
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # La web no necesita Electron: evita descargar ~130 MB en cada publicación
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Solo este job puede publicar en Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

# Envía por push los recordatorios que han vencido (scripts/reminders/send.mjs).
# GitHub ejecuta los programados cada 5 minutos como mínimo y a veces con algo de retraso.
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (Settings → Secrets and variables → Actions); sin él no hace nada.
name: Enviar recordatorios

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: recordatorios
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scripts/reminders
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/reminders
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/reminders/package-lock.json
      - run: npm ci --omit=dev
      - run: node send.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
